repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep this in sync with the `ruff` floor in pyproject.toml `[dev]`.
    # If contributors run a newer local ruff than pre-commit pins, the same
    # source can lint/format differently in two places — exactly the kind
    # of drift CI parity is meant to prevent.
    rev: v0.16.7
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        files: ^src/mira/
        args: [--ignore-missing-imports]
        # Manual stage only — the codebase has accumulated type-annotation
        # debt that we'll clean up incrementally. Run on demand with
        # `pre-commit run mypy --hook-stage manual --all-files`.
        stages: [manual]
        additional_dependencies:
          - pydantic>=2.13.5
          - click>=8.5.0
          - httpx>=0.28.1
          - jinja2>=3.1.6
