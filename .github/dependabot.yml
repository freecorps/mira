version: 2

# Mira dependency update policy.
#
# `actions` updates keep the GitHub Actions referenced in our workflows on
# their latest pinned SHA — important because a tag like `actions/checkout@v4`
# can be moved by the action's owner without our knowledge, but a pinned
# SHA can't. New SHAs are proposed weekly via PR.
#
# `pip` covers the Python dependency tree (uv.lock + pyproject.toml).
# `npm` covers the dashboard UI.
#
# Updates are grouped so a week's worth of bumps arrives as one PR per
# ecosystem instead of ten — each PR is a full CI run, and the runs were
# most of what the pipeline spent its time on.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - python
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/ui/mira"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(ui)"
    labels:
      - dependencies
      - ui
    open-pull-requests-limit: 10
    groups:
      ui-minor-and-patch:
        update-types: ["minor", "patch"]

  # `docker` keeps the digest-pinned base images in the Dockerfile current.
  # Without this the pins would freeze node/python at whatever they pointed
  # at the day they were written, which trades one supply-chain problem
  # (a moving tag) for a worse one (a base image that never gets patched).
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - docker
    groups:
      docker:
        patterns: ["*"]
