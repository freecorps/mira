name: Benchmark

# The noisy, threshold-based quality evals (the F1 scorecard). Tracked over
# time, NOT a release gate — a single probabilistic run shouldn't block a
# ship. Manual dispatch only; failures here are a signal to investigate,
# not a stop-the-line.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra serve

      - name: Run benchmark evals
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --no-sync pytest tests/evals/ -v -m benchmark
